name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/blog
            mkdir -p /tmp/blog_backup
            rsync -a src/content/ /tmp/blog_backup/content/
            rsync -a src/data/ /tmp/blog_backup/data/

            echo "=== DEPLOY $(date) ===" > public/debug-deploy.txt
            # Unset skip-worktree before git reset to prevent merge aborts
            git update-index --no-skip-worktree src/data/subscribers.json src/data/leads.json src/data/products.json 2>&1 >> public/debug-deploy.txt || true

            git fetch origin main --force 2>&1 >> public/debug-deploy.txt
            git reset --hard FETCH_HEAD 2>&1 >> public/debug-deploy.txt
            git clean -fd 2>&1 >> public/debug-deploy.txt

            # Restore user data
            rsync -a /tmp/blog_backup/content/ src/content/
            rsync -a /tmp/blog_backup/data/subscribers.json src/data/subscribers.json 2>/dev/null || true
            rsync -a /tmp/blog_backup/data/leads.json src/data/leads.json 2>/dev/null || true
            if [ -s /tmp/blog_backup/data/products.json ]; then
              cp /tmp/blog_backup/data/products.json src/data/products.json
            fi
            node -e "try { const fs = require('fs'); const p = JSON.parse(fs.readFileSync('src/data/products.json', 'utf8')); p.forEach(x => { if (x.id === 'ebook-tao-blog' && !x.link) x.link = '/ebook-tao-blog'; }); fs.writeFileSync('src/data/products.json', JSON.stringify(p, null, 2)); } catch(e) {}"
            rm -rf /tmp/blog_backup

            # Clean up duplicate and old files from server content
            rm -f src/content/cuoc-song/xay-tai-san-tin-nhiem-loi-thoat-cho-khung-hoang-tuoi-25.md 2>/dev/null || true
            rm -f src/content/cuoc-song/dung-nhat-bac-cac-de-roi-danh-mat-ca-co-do-dai-han.md 2>/dev/null || true
            git checkout src/content/cuoc-song/thoi-ngay-nhat-bac-cac-de-roi-danh-mat-ca-co-do-dai-han.md 2>/dev/null || true
            git checkout src/content/ai/lo-trinh-tu-hoc-xay-dung-ai-agent-2026-dung-bat-dau-tu-cong-cu.md 2>/dev/null || true
            git checkout src/content/ai/prompt-engineering-tang-cot-loi-dau-tien-trong-thiet-ke-instruction-cho-ai-agent.md 2>/dev/null || true
            git checkout src/content/ai/context-engineering-nghe-thuat-kiem-soat-nhung-gi-mo-hinh-duoc-thay.md 2>/dev/null || true
            git checkout src/content/ai/harness-engineering-he-xuong-suon-van-hanh-ai-agent-trong-thuc-te.md 2>/dev/null || true
            git checkout src/content/ai/pha-bo-ao-tuong-ai-agent-khong-chi-la-prompt-cong-voi-tool.md 2>/dev/null || true
            rm -f src/content/cuoc-song/ngung-dung-y-chi-hay-dung-he-thong-de-xay-thoi-quen.md 2>/dev/null || true
            git checkout src/content/cuoc-song/xay-mong-vung-chac-cho-tuong-lai-tu-tuoi-25.md 2>/dev/null || true
            git checkout src/content/cuoc-song/bi-mat-hieu-ung-lai-kep-ma-cac-khoa-hoc-giau-nhem.md 2>/dev/null || true
            git checkout src/content/cuoc-song/cach-tro-thanh-thoi-nam-cham-thu-hut-moi-co-hoi.md 2>/dev/null || true
            git checkout src/content/cuoc-song/vi-sao-nhung-loi-khuyen-chan-thanh-lai-hay-bi-gat-di.md 2>/dev/null || true
            git checkout src/content/cuoc-song/cho-de-cam-xuc-boc-dong-pha-nat-su-nghiep-cua-anh-em.md 2>/dev/null || true
            git checkout src/content/cuoc-song/dung-de-luong-cung-la-phao-cuu-sinh-duy-nhat.md 2>/dev/null || true
            git checkout src/content/ai/ngung-hoc-vet-cong-cu-hay-hoc-tu-duy-ra-lenh-cho-ai.md 2>/dev/null || true
            git checkout src/content/cuoc-song/nghich-ly-nguoi-gioi-cang-cay-sau-cang-thay-minh-kem.md 2>/dev/null || true
            git checkout src/content/cuoc-song/ngung-lam-idol-mang-hay-lam-nguoi-ghi-chep-tan-tuy.md 2>/dev/null || true
            git checkout src/content/cuoc-song/cang-co-to-ra-hoan-hao-anh-em-cang-de-mat-gia.md 2>/dev/null || true
            git checkout src/content/cuoc-song/choi-he-ben-vung-duong-ai-nay-di-dich-ai-nay-toi.md 2>/dev/null || true
            rm -f src/content/cuoc-song/cho-voi-di-ban-hang-khi-chua-biet-ro-minh-gioi-gi.md 2>/dev/null || true
            git checkout src/content/marketing/cho-voi-di-ban-hang-khi-chua-biet-ro-minh-gioi-gi.md 2>/dev/null || true
            git checkout src/content/cuoc-song/bi-quyet-ban-minh-khong-nguong-noi-ve-khach-dung-khoe-than.md 2>/dev/null || true
            git checkout src/content/cuoc-song/10-prompt-ai-giup-anh-em-thoat-khoi-mot-nguon-thu-duy-nhat.md 2>/dev/null || true
            git checkout src/content/cuoc-song/tien-mat-co-thuc-su-cuu-anh-em-khi-khung-hoang-ap-den.md 2>/dev/null || true
            git checkout src/content/cuoc-song/thoat-khoi-vong-xoay-phan-ung-de-lam-chu-cuoc-doi.md 2>/dev/null || true
            git checkout src/content/cuoc-song/bi-mat-giup-anh-em-mien-nhiem-voi-moi-loi-khuyen-doc-hai.md 2>/dev/null || true
            git checkout src/content/cuoc-song/cai-bay-cua-su-an-toan-dang-am-tham-huy-hoai-anh-em.md 2>/dev/null || true
            git checkout src/content/cuoc-song/dung-tu-nhot-minh-duoi-day-gieng-cua-mot-chuyen-mon-hep.md 2>/dev/null || true
            git checkout src/content/cuoc-song/giai-ma-chuoi-gia-tri-loi-thoat-cho-su-chenh-venh-tuoi-25.md 2>/dev/null || true
            git checkout src/content/cuoc-song/thoat-khoi-bay-thu-nhap-tuyen-tinh-tuoi-25.md 2>/dev/null || true
            git update-index --skip-worktree src/data/subscribers.json src/data/leads.json src/data/products.json 2>/dev/null || true




















            echo "--- GIT LOG ---" >> public/debug-deploy.txt
            git log -n 2 --oneline >> public/debug-deploy.txt
            echo "--- PM2 BEFORE ---" >> public/debug-deploy.txt
            pm2 list >> public/debug-deploy.txt 2>&1 || true
            npm install >> public/debug-deploy.txt 2>&1
            rm -rf .astro dist node_modules/.astro node_modules/.vite
            npm run build >> public/debug-deploy.txt 2>&1
            echo "--- RESTARTING PM2 ---" >> public/debug-deploy.txt
            pm2 restart all --update-env >> public/debug-deploy.txt 2>&1 || pm2 start dist/server/entry.mjs --name blog >> public/debug-deploy.txt 2>&1
            systemctl reload nginx >> public/debug-deploy.txt 2>&1 || true
            echo "--- PM2 AFTER ---" >> public/debug-deploy.txt
            pm2 list >> public/debug-deploy.txt 2>&1 || true
            echo "=== DEPLOY COMPLETE ===" >> public/debug-deploy.txt
            cp public/debug-deploy.txt dist/client/debug-deploy.txt 2>/dev/null || true
