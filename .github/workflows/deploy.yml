name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '180.93.136.93'
          username: 'root'
          password: '#wF?*tyPs^j4'
          script: |
            cd /var/www/blog
            # Backup user content and data to prevent losing them during git update
            mkdir -p /tmp/blog_backup
            rsync -a src/content/ /tmp/blog_backup/content/
            rsync -a src/data/ /tmp/blog_backup/data/

            git fetch --all
            git reset --hard origin/main
            git clean -fd

            # Restore and merge user content and data back
            rsync -a /tmp/blog_backup/content/ src/content/
            rsync -a /tmp/blog_backup/data/ src/data/
            rm -rf /tmp/blog_backup

            # Clean up duplicate and old files from server content
            rm -f src/content/cuoc-song/xay-tai-san-tin-nhiem-loi-thoat-cho-khung-hoang-tuoi-25.md
            rm -f src/content/cuoc-song/dung-nhat-bac-cac-de-roi-danh-mat-ca-co-do-dai-han.md
            rm -f src/content/cuoc-song/ngung-dung-y-chi-hay-dung-he-thong-de-xay-thoi-quen.md
            git checkout src/content/cuoc-song/xay-mong-vung-chac-cho-tuong-lai-tu-tuoi-25.md
            git checkout src/content/cuoc-song/bi-mat-hieu-ung-lai-kep-ma-cac-khoa-hoc-giau-nhem.md
            git checkout src/content/cuoc-song/cach-tro-thanh-thoi-nam-cham-thu-hut-moi-co-hoi.md




            npm install
            rm -rf .astro dist node_modules/.astro node_modules/.vite
            npm run build
            npm install -g pm2
            HOST=127.0.0.1 PORT=3001 pm2 restart blog --update-env || HOST=127.0.0.1 PORT=3001 pm2 start dist/server/entry.mjs --name blog
            systemctl reload nginx
